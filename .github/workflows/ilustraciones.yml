# Genera las ilustraciones de los cuentos con Pollinations.ai (scripts/generate_story_images.py)
# y las sube a la rama «ilustraciones-cuentos» para revisarlas antes de publicarlas.
# Se ejecuta a mano desde la pestaña Actions (o desde la API).
name: Generar ilustraciones de cuentos

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Ids separados por coma (vacío = todos los que falten)'
        required: false
        default: ''
      force:
        description: 'Regenerar aunque ya existan'
        type: boolean
        default: false
      provider:
        description: 'Servicio de imágenes'
        type: choice
        options: [pollinations, huggingface]
        default: pollinations
      model:
        description: 'Modelo de Hugging Face (vacío = FLUX.1-schnell)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ilustraciones
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Siempre se parte del código actual (el de la rama que lanza el flujo) y se recuperan
      # las ilustraciones ya generadas en ilustraciones-cuentos. Antes se hacía un merge, que
      # fallaba con historias distintas y dejaba el script nuevo afuera sin avisar.
      - name: Partir del código actual y recuperar las ilustraciones ya generadas
        run: |
          git checkout -B ilustraciones-cuentos
          if git ls-remote --exit-code --heads origin ilustraciones-cuentos >/dev/null; then
            git fetch origin ilustraciones-cuentos
            git checkout origin/ilustraciones-cuentos -- public/cuentos 2>/dev/null || true
            git reset -q
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow huggingface_hub
      - name: Generar
        env:
          # Token de Hugging Face como secreto del repositorio (Settings → Secrets → Actions → HF_TOKEN).
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ONLY: ${{ inputs.only }}
          HF_MODEL: ${{ inputs.model }}
          FORCE: ${{ inputs.force }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          SCRIPT=scripts/generate_story_images.py
          if [ "$PROVIDER" = "huggingface" ]; then
            if [ -z "$HF_TOKEN" ]; then echo "::error::Falta el secreto HF_TOKEN"; exit 1; fi
            SCRIPT=scripts/generate_story_images_hf.py
          fi
          if [ ! -f "$SCRIPT" ]; then echo "::error::No existe $SCRIPT"; exit 1; fi
          ARGS=""
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          set +e
          python3 "$SCRIPT" $ARGS
          code=$?
          set -e
          # 1 = algunas imágenes fallaron (se suben las que salieron); otro código = error de configuración.
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then echo "::error::El script terminó con código $code"; exit "$code"; fi
      - name: Subir a la rama ilustraciones-cuentos
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cuentos src/domain/story-art.ts
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Ilustraciones de cuentos generadas ($PROVIDER)"
          # Rama de revisión: se reescribe en cada corrida a partir del código actual.
          git push --force origin ilustraciones-cuentos
      - uses: actions/upload-artifact@v4
        with:
          name: ilustraciones
          path: public/cuentos/*.webp
          if-no-files-found: ignore
