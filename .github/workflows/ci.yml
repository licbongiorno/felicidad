# Integración continua: cada cambio a main (o pull request) se verifica antes de llegar a
# los pacientes. Vercel publica igual, pero esta comprobación avisa si algo se rompió.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'

  reglas:
    name: Reglas de Firestore (emulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules

  # Las pruebas de navegador se reparten en dos máquinas que corren a la vez, cada una con su
  # propio servidor de Next (el servidor es el cuello de botella si se comparte).
  e2e-parte:
    name: Punta a punta (parte ${{ matrix.shard }} de 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trazas-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Conserva el nombre del control de siempre: pasa sólo si pasaron las dos partes.
  e2e:
    name: Punta a punta y accesibilidad
    runs-on: ubuntu-latest
    needs: e2e-parte
    if: always()
    steps:
      - run: test "${{ needs.e2e-parte.result }}" = "success"
